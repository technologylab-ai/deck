[project]
name = "deck"
version = "0.1.0"
description = "Idempotently open macOS apps/tabs on AeroSpace workspaces for Stream Deck"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
deck = "deck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deck"]
